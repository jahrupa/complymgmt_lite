# Example nginx site for complymgmt_lite (same file for staging and production; change
# server_name, the TLS lines and the root to suit the server).
# Install: copy to /etc/nginx/conf.d/ (or sites-available + symlink), then `nginx -t && systemctl reload nginx`.
#
# The pipeline only swaps the `current` symlink; nginx follows it on every request, so a deploy
# or rollback needs no reload.

server {
    listen 80;
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/<host>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<host>/privkey.pem;
    server_name stage.example.com;   # <- the app's host name

    root /var/www/complymgmt_lite/current;   # <- DEPLOY_PATH/current
    index index.html;

    # Vite fingerprints everything under /assets, so it can be cached for good
    location /assets/ {
        try_files $uri @previous_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A tab opened before the last deploy still asks for the old release's lazy chunks
    # (xlsx, docx-preview, jszip); serve those from the previous release instead of a 404.
    location @previous_assets {
        root /var/www/complymgmt_lite/previous;   # <- DEPLOY_PATH/previous
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Must never be cached: they decide which release a browser (and the health check) gets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # BrowserRouter: unknown paths load the app, which routes on the client
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
