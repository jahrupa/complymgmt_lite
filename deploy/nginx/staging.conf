# Staging: http://complymgmt.stage -> built files on the staging server (on-prem, internal DNS).
# Same model as production (nginx serving the vite build, no Node process), but `root` points at
# the release the pipeline last activated.
#
# Install on the staging server (Rocky Linux):
#   sudo cp deploy/nginx/staging.conf /etc/nginx/conf.d/complymgmt_lite.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name complymgmt.stage;

    root /var/www/complymgmt_lite/current;
    index index.html;

    # Vite fingerprints everything under /assets, so it can be cached for good
    location /assets/ {
        try_files $uri @previous_assets;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A tab opened before the last deploy still asks for the old release's lazy chunks
    location @previous_assets {
        root /var/www/complymgmt_lite/previous;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Must never be cached: they decide which release a browser (and the health check) gets
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # BrowserRouter: unknown paths load the app, which routes on the client
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# HTTPS, once there is a certificate for complymgmt.stage from an internal CA (public CAs such as
# Let's Encrypt can't issue for a name that only exists in internal DNS). Then:
#   - uncomment this block and the redirect below,
#   - set the staging APP_URL to https://complymgmt.stage,
#   - make sure the staging server itself trusts the internal CA (the health check uses curl there):
#       sudo cp internal-ca.crt /etc/pki/ca-trust/source/anchors/ && sudo update-ca-trust
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name complymgmt.stage;
#     ssl_certificate     /etc/pki/tls/certs/complymgmt.stage.crt;
#     ssl_certificate_key /etc/pki/tls/private/complymgmt.stage.key;
#
#     # ...same root and location blocks as the port 80 server above...
# }
#
# And in the port 80 server, replace the location blocks with:
#     return 301 https://complymgmt.stage$request_uri;
